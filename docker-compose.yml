# Services
services:
  # Nginx Service
  nginx:
    image: nginx:1.27
    ports:
      - 80:80
    volumes:
      - ./src:/var/www
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
  # PHP Service
  php:
    build: ./.docker/php
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql
  # MySQL
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: xbotv2
    volumes:
      - ./.docker/mysql/my.cnf:/etc/mysql/my.cnf
      - mysqldataxbot:/var/lib/mysql
  # PhpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.2
    ports:
      - 8080:80
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
# Volumes
volumes:
  mysqldataxbot:
